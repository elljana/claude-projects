<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio ni Tala</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: the pixel room is the hero on the left; a lived-in "house notebook" panel sits on the right and stacks under it on phones. Zen mode hides everything but the room. */
:root{
  --bg:#1c1824; --panel:#25202e; --panel-2:#2f2839; --line:#3b3347;
  --ink:#f2e8d8; --muted:#aa9fb4; --accent:#f2b544; --jade:#74c6a4; --rose:#e8808a; --sky:#8fb8e8;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start;box-sizing:border-box;min-height:100%;
  padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.stage-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;margin:0;color:var(--accent);letter-spacing:.5px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.clock b{font-family:var(--display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#0d0b12;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 18px 40px -20px rgba(0,0,0,.7)}
.stage canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain;cursor:pointer;background:#0d0b12}
.bubble{position:absolute;left:0;top:0;transform:translate(-50%,-100%);max-width:min(240px,60%);background:#fffaf0;color:#2a2230;font-family:var(--display);font-size:13px;line-height:1.25;padding:6px 9px;border-radius:4px;box-shadow:0 2px 0 #2a2230,0 0 0 2px #2a2230;pointer-events:none;text-align:center;white-space:normal;transition:opacity .25s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:8px;height:8px;background:#fffaf0;transform:translateX(-50%) rotate(45deg);box-shadow:2px 2px 0 #2a2230}
.bubble.fade{opacity:0}
.stage-tools{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;gap:6px;opacity:.35;transition:opacity .2s}
.stage:hover .stage-tools,.stage-tools:focus-within{opacity:1}
@media (hover:none){.stage-tools{opacity:.85}}
button{font-family:var(--display);font-size:14px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:7px 12px;cursor:pointer;box-shadow:0 2px 0 #14111a}
button:hover{background:#3a3146}
button:active{transform:translateY(1px);box-shadow:0 1px 0 #14111a}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage-tools button{background:rgba(28,24,36,.85);font-size:12px;padding:5px 9px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .primary{background:var(--accent);color:#2a1d08;border-color:#c48d26}
.actions .primary:hover{background:#ffc75e}
.speed{display:inline-flex;margin-left:auto;border:1px solid var(--line);border-radius:5px;overflow:hidden;box-shadow:0 2px 0 #14111a}
.speed button{border:0;border-radius:0;box-shadow:none;background:var(--panel);padding:7px 10px;font-variant-numeric:tabular-nums}
.speed button+button{border-left:1px solid var(--line)}
.speed button.on{background:var(--jade);color:#10241c}
.hint{margin:0;color:var(--muted);font-size:13px}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.activity{font-family:var(--display);font-size:20px;line-height:1.15;color:var(--ink);text-wrap:balance}
.thought{margin-top:6px;color:var(--muted);font-style:italic;min-height:1.4em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink)}
.chip.mood{background:#3a2f1a;border-color:#6a5222;color:var(--accent)}
.chip.crave{background:#1d3329;border-color:#2f5a48;color:var(--jade)}
.needs{display:grid;gap:8px}
.need{display:grid;grid-template-columns:92px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:13px}
.need span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.bar{height:8px;background:#17141d;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--jade);transition:width .6s}
.bar i.mid{background:var(--accent)}
.bar i.low{background:var(--rose)}
.fridge{display:flex;flex-wrap:wrap;gap:5px}
.fridge .chip{font-weight:600}
.fridge .chip.out{opacity:.4;text-decoration:line-through}
.traits{color:var(--ink);font-size:13px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.log li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px;font-size:13px}
.log time{font-family:var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
body.zen .app{display:block;padding:0;max-width:none;height:100%}
body.zen .stage-col{height:100%;gap:0}
body.zen .topbar,body.zen .actions,body.zen .hint,body.zen .panel{display:none}
body.zen .stage{aspect-ratio:auto;height:100%;border-radius:0;box-shadow:none}
.stage:fullscreen{aspect-ratio:auto;width:100%;height:100%;border-radius:0}
@media (prefers-reduced-motion:reduce){.bubble,.bar i{transition:none}}
</style>
</head>
<body>

<div class="app" id="app">
  <section class="stage-col">
    <header class="topbar">
      <div>
        <h1>Studio ni Tala</h1>
        <div class="sub" id="sub">Day 1 kasama mo</div>
      </div>
      <div class="clock"><b id="clock">--:--</b><span class="sub" id="weather">—</span></div>
    </header>
    <div class="stage" id="stage">
      <canvas id="c" width="320" height="180" aria-label="Pixel art na studio apartment kung saan nakatira si Tala kasama ang pusang si Siopao at asong si Kikiam"></canvas>
      <div class="bubble fade" id="bubble"></div>
      <div class="stage-tools">
        <button id="zenBtn" type="button">Zen mode</button>
        <button id="fsBtn" type="button">Fullscreen</button>
      </div>
    </div>
    <div class="actions">
      <button id="knockBtn" type="button">Kumatok sa bintana</button>
      <button id="giftBtn" type="button" class="primary">Mag-iwan ng meryenda</button>
      <div class="speed" role="group" aria-label="Bilis ng oras">
        <button type="button" data-speed="1" class="on">1×</button>
        <button type="button" data-speed="4">4×</button>
        <button type="button" data-speed="12">12×</button>
      </div>
    </div>
    <p class="hint">I-click si Tala, si Siopao (pusa) o si Kikiam (aso). Naka-sync ang araw at gabi sa totoong oras mo. Ang Zen mode ay para sa second monitor.</p>
  </section>

  <aside class="panel" id="panel">
    <div class="card">
      <div class="eyebrow">Ginagawa ngayon</div>
      <div class="activity" id="activity">Nag-iisip kung ano gagawin</div>
      <div class="thought" id="thought"></div>
      <div class="chips"><span class="chip mood" id="mood">chill</span><span class="chip crave" id="craving">craving: —</span></div>
    </div>
    <div class="card">
      <div class="eyebrow">Lagay ni Tala</div>
      <div class="needs" id="needs"></div>
    </div>
    <div class="card">
      <div class="eyebrow">Laman ng ref</div>
      <div class="fridge" id="fridge"></div>
    </div>
    <div class="card">
      <div class="eyebrow">Ugali</div>
      <div class="traits" id="traits"></div>
    </div>
    <div class="card">
      <div class="eyebrow">Diary ng bahay</div>
      <ol class="log" id="log"></ol>
    </div>
  </aside>
</div>

<script>
(()=>{
"use strict";
// ---------- basics ----------
const W=320,H_=180;
const cv=document.getElementById('c');const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const lc=document.createElement('canvas');lc.width=W;lc.height=H_;const lctx=lc.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const chance=p=>Math.random()<p;
function wpick(items){let t=0;for(const i of items)t+=Math.max(0,i[1]);if(t<=0)return items.length?items[0][0]:null;let r=Math.random()*t;for(const [it,w] of items){r-=Math.max(0,w);if(r<=0)return it}return items[items.length-1][0]}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function shade(h,a){const[r,g,b]=hex2rgb(h);return rgb2hex(r+a,g+a,b+a)}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}

const NAME='Tala',CAT='Siopao',DOG='Kikiam';
let speed=1;let timeOffset=0;let catchingUp=false;
const nowDate=()=>new Date(Date.now()+timeOffset);
function hourF(){const d=nowDate();return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600}
const dateKey=()=>{const d=nowDate();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const hhmm=()=>{const d=nowDate();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

// ---------- persistent state ----------
const saved=store.get('tala-studio-v1',null)||{};
const traits=saved.traits||{neat:Math.random(),foodie:Math.random(),owl:chance(.4),drama:Math.random()};
const firstVisit=saved.firstVisit||Date.now();
const needs=Object.assign({hunger:70,energy:80,fun:65,hygiene:80,social:60},saved.needs||{});
const inv=Object.assign({manok:2,baboy:2,baka:1,itlog:6,gulay:3,canton:4,tablea:1,delata:2,kape:8,chichirya:2,icecream:1,pandesal:4},saved.inv||{});
let mess=saved.mess||[];
let logEntries=saved.log||[];
let recent=saved.recent||[];
let favs=saved.favs||null;
let craving=saved.craving||null,cravingUntil=saved.cravingUntil||0;
let plantWater=saved.plantWater??70;
let today=saved.today&&saved.today.date===dateKey()?saved.today:{date:dateKey(),ate:{},coffee:false,shower:false,fed:{},woke:false,snoozed:false};
let weather=saved.weather&&saved.weather.until>Date.now()?saved.weather:null;
let moodBoost=0;
function save(){store.set('tala-studio-v1',{traits,firstVisit,needs,inv,mess,log:logEntries.slice(0,60),recent:recent.slice(0,8),favs,craving,cravingUntil,plantWater,today,weather,lastSave:Date.now()})}

const DISHES=[
 {id:'adobo',name:'adobong manok',need:{manok:1},meal:['lunch','dinner'],c:'#6b3a1e'},
 {id:'sinigang',name:'sinigang na baboy',need:{baboy:1,gulay:1},meal:['lunch','dinner'],c:'#b9a36a',rainy:1.8},
 {id:'tinola',name:'tinolang manok',need:{manok:1,gulay:1},meal:['lunch','dinner'],c:'#d8c27a',rainy:1.6},
 {id:'sisig',name:'sisig',need:{baboy:1,itlog:1},meal:['lunch','dinner','midnight'],c:'#8a4b2a'},
 {id:'tapsilog',name:'tapsilog',need:{baka:1,itlog:1},meal:['breakfast','lunch'],c:'#7a3b22'},
 {id:'sinangag',name:'sinangag at itlog',need:{itlog:1},meal:['breakfast'],c:'#f0d070'},
 {id:'spamsilog',name:'spamsilog',need:{delata:1,itlog:1},meal:['breakfast','lunch','midnight'],c:'#d86a5a'},
 {id:'canton',name:'pancit canton',need:{canton:1},meal:['midnight','lunch','dinner','snack'],c:'#e8b04a',lazy:2},
 {id:'champorado',name:'champorado',need:{tablea:1},meal:['breakfast','snack'],c:'#4a2a1a',rainy:2.6},
 {id:'arrozcaldo',name:'arroz caldo',need:{manok:1},meal:['breakfast','dinner'],c:'#e8d39a',rainy:2.3},
 {id:'torta',name:'tortang talong',need:{itlog:1,gulay:1},meal:['lunch','dinner','breakfast'],c:'#a8743a'},
 {id:'giniling',name:'giniling',need:{baka:1,gulay:1},meal:['lunch','dinner'],c:'#8a5030'},
];
if(!favs){favs=[];while(favs.length<2){const d=pick(DISHES).id;if(!favs.includes(d))favs.push(d)}}
const DELIVERY=['fried chicken na may gravy','milk tea at siomai','pizza (para sa isa, promise)','lechon kawali','shawarma rice','burger at fries','lomi','pares'];
const GIFTS=['turon','banana cue','taho','kwek-kwek','bibingka','puto bumbong','ensaymada','buko pie'];
const INV_LABEL={manok:'manok',baboy:'baboy',baka:'baka',itlog:'itlog',gulay:'gulay',canton:'pancit canton',tablea:'tablea',delata:'de lata',kape:'kape',chichirya:'chichirya',icecream:'ice cream',pandesal:'pandesal'};

// ---------- log & speech ----------
const logEl=document.getElementById('log');
function log(text){if(catchingUp&&logEntries.length&&logEntries[0].text===text)return;logEntries.unshift({t:hhmm(),text});if(logEntries.length>60)logEntries.length=60;renderLog()}
function renderLog(){logEl.innerHTML='';for(const e of logEntries.slice(0,40)){const li=document.createElement('li');const tm=document.createElement('time');tm.textContent=e.t;const sp=document.createElement('span');sp.textContent=e.text;li.append(tm,sp);logEl.append(li)}}
const bubbleEl=document.getElementById('bubble');let bubbleT=0,bubbleOwner='human';let thoughtText='';
function say(text,owner='human'){if(catchingUp||!text)return;bubbleEl.textContent=text;bubbleEl.classList.remove('fade');bubbleT=5.5;bubbleOwner=owner;if(owner==='human'){thoughtText='“'+text+'”'}}

// ---------- spots ----------
const LANE=134;
const S={
 door:{x:12,y:136,f:-1},fridge:{x:32,y:136,f:-1},sink:{x:56,y:134},stove:{x:82,y:134},counter:{x:64,y:134},bowls:{x:56,y:138,f:-1},
 window:{x:121,y:133},table:{x:121,y:147},shelf:{x:157,y:134},plant:{x:166,y:134,f:1},desk:{x:198,y:130},
 sofa:{x:236,y:132},rug:{x:238,y:148},bed:{x:283,y:134},bath:{x:312,y:134,f:1},center:{x:170,y:150},
};

// ---------- entities ----------
const H={x:170,y:150,f:1,pose:'stand',prop:null,back:false,dy:0,visible:true,inBed:false,anim:null,plan:[],cur:null,label:'Nag-iisip kung ano gagawin',walkT:0,wave:0,icon:null,iconT:0,lineT:20,away:false};
const cat={x:124,y:92,elev:'sill',f:1,state:'sleep',t:0,dur:60,path:[],jump:null,walkT:0,react:0,face:null};
const dog={x:160,y:163,f:1,state:'sleep',t:0,dur:40,tx:160,ty:163,walkT:0,wag:0,react:0};
let fridgeOpen=false,cooking=null,tableDish=null,screen=null,gift=null,bowlsFull=false,ball=null,windowShake=0,doorbell=0,fallingCup=null,lightsOff=false,deskLamp=false,phoneGlow=false,kettle=0,flash=0;
const particles=[];
function emit(type,x,y,o={}){if(catchingUp)return;particles.push(Object.assign({type,x,y,vx:rnd(-3,3),vy:-8,life:0,max:1.6},o))}

// ---------- needs & mood ----------
const DECAY={hunger:100/(3.6*3600),energy:100/(16*3600),fun:100/(48*60),hygiene:100/(14*3600),social:100/(85*60)};
function addNeed(k,v){needs[k]=clamp(needs[k]+v,0,100)}
function messCount(){return mess.length}
function tidiness(){return clamp(100-mess.length*14,0,100)}
function moodScore(){return (needs.hunger+needs.energy+needs.fun+needs.hygiene+needs.social+tidiness())/6+moodBoost}
function moodLabel(){
 if(H.inBed&&H.cur&&H.cur.sleep)return'tulog, wag istorbohin';
 if(H.away)return'wala sa bahay';
 if(needs.hunger<18)return'gutom na gutom';
 if(needs.energy<18)return'antok na antok';
 if(needs.fun<15)return'bored to death';
 if(needs.hygiene<22)return'medyo amoy-araw';
 if(needs.social<18)return'lonely';
 const m=moodScore();
 if(m>80)return'masaya';if(m>64)return'chill';if(m>48)return'meh';return'emo';
}
function mealSlot(hf){if(hf>=6.5&&hf<10)return'breakfast';if(hf>=11.5&&hf<14)return'lunch';if(hf>=18&&hf<21)return'dinner';if(hf>=22||hf<3)return'midnight';return null}
function bedtime(){const base=traits.owl?24.6:23.1;return base+((today.date.length*7)%5-2)*0.15}
function wakeTime(){const base=traits.owl?8.6:7.0;return base+((today.date.length*3)%5-2)*0.15}
function isSleepTime(hf=hourF()){const h=hf<12?hf+24:hf;return h>=bedtime()&&h<wakeTime()+24}
function outfit(){const pal=['#e27d60','#5fb3ae','#e8a87c','#c38d9e','#41a38f','#e9c46a','#7a6fbf','#ef8f6f','#5d8fd0'];const d=nowDate();return pal[(d.getDate()+d.getMonth()*3)%pal.length]}
function dayNum(){const a=new Date(firstVisit);a.setHours(0,0,0,0);return Math.floor((nowDate()-a)/86400000)+1}

// ---------- weather ----------
function rollWeather(){const m=nowDate().getMonth();const rainy=(m>=5&&m<=10)?0.3:0.15;const r=Math.random();const type=r<rainy?'ulan':r<rainy+0.3?'maulap':'araw';weather={type,until:Date.now()+rnd(25,70)*60000}}
if(!weather)rollWeather();
const WEATHER_LABEL={araw:'maaraw',maulap:'maulap',ulan:'umuulan'};

// ---------- plan helpers ----------
const go=(spot,o={})=>({type:'go',to:typeof spot==='string'?S[spot]:spot,...o});
const act=o=>({type:'act',...o});
const call=fn=>({type:'call',fn});
function makePath(from,to){const p=[];if(Math.abs(from.y-LANE)>3&&Math.abs(from.x-to.x)>6)p.push({x:from.x,y:LANE});if(Math.abs(to.y-LANE)>3&&Math.abs(from.x-to.x)>6)p.push({x:to.x,y:LANE});p.push({x:to.x,y:to.y});return p}
function setPlan(label,steps){H.label=label;H.plan=steps;H.cur=null;H.anim=null;nextStep()}
function nextStep(){
 let guard=0;
 while(guard++<20){
  H.cur=H.plan.shift()||null;
  if(!H.cur){H.anim=null;chooseNext();return}
  const s=H.cur;s.t=0;
  if(s.type==='call'){s.fn();continue}
  if(s.type==='go'){H.pose='walk';if('prop' in s)H.prop=s.prop;H.back=false;H.dy=0;H.visible=true;H.inBed=false;H.anim=null;
   if(s.from){H.x=s.from.x;H.y=s.from.y}
   s.path=makePath(H,s.to);return}
  if(s.type==='act'){H.pose=s.pose||'stand';H.prop=s.prop||null;H.back=!!s.back;H.dy=s.dy||0;H.visible=!s.hidden;H.inBed=!!s.inBed;H.anim=s.anim||null;
   if(s.x!=null)H.x=s.x;if(s.y!=null)H.y=s.y;if(s.f)H.f=s.f;
   if(s.label)H.label=s.label;
   if(s.icon){H.icon=s.icon;H.iconT=4}
   s.start&&s.start(s);
   if(s.say)say(typeof s.say==='function'?s.say():pick(s.say));
   H.lineT=rnd(18,35);return}
 }
}

// ---------- dish logic ----------
const canMake=d=>Object.entries(d.need).every(([k,v])=>(inv[k]||0)>=v);
const canCookAny=()=>DISHES.some(canMake);
function useIng(d){for(const [k,v] of Object.entries(d.need))inv[k]=Math.max(0,inv[k]-v)}
function lowStock(){return (inv.manok+inv.baboy+inv.baka)<2||inv.itlog<2||inv.gulay<1||DISHES.filter(canMake).length<3}
function chooseDish(){
 const slot=mealSlot(hourF())||'snack';const rain=weather.type==='ulan';
 const opts=DISHES.filter(canMake).map(d=>{let w=1;

function updateHuman(dt){

 const s=H.cur;if(!s){chooseNext();return}
 if(s.type==='go'){
  const p=s.path[0];if(!p){H.pose='stand';nextStep();return}
  const dx=p.x-H.x,dy=p.y-H.y,d=Math.hypot(dx,dy),sp=28*dt;
  if(Math.abs(dx)>0.5)H.f=dx>0?1:-1;

  H.walkT+=dt;
 }else if(s.type==='act'){
  s.t+=dt;
  if(s.gain)for(const k in s.gain)addNeed(k,s.gain[k]*dt/Math.min(s.dur,99999));
  s.tick&&s.tick(dt,s);
  if(H.cur!==s)return;
  H.lineT-=dt;if(s.lines&&H.lineT<=0){H.lineT=rnd(25,45);if(!catchingUp)say(pick(s.lines))}

 }
}

 if(homeAwake&&dk>.12){const g=ctx.createRadialGradient(121,40,0,121,40,140);g.addColorStop(0,'rgba(255,190,110,.10)');g.addColorStop(1,'rgba(255,190,110,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H_)}
}
function drawSunbeam(){const dk=darkness();if(dk>.25||weather.type==='ulan')return;const a=(1-dk/.25)*(weather.type==='maulap'?.05:.13);ctx.fillStyle=`rgba(255,236,190,${a})`;ctx.beginPath();ctx.moveTo(102,92);ctx.lineTo(140,92);ctx.lineTo(152,152);ctx.lineTo(108,152);ctx.closePath();ctx.fill()}

function render(t){
 const hf=hourF();
 drawRoom(t,hf);
 drawSunbeam();
 const ents=[];
 ents.push([156,drawTable]);ents.push([131,drawChair]);ents.push([167,drawDogBed]);ents.push([136,drawGift]);
 for(const m of mess)if(!(m.y<145&&m.x>100&&m.x<140))ents.push([m.y,()=>drawMess(m)]);
 ents.push([H.inBed?200:H.y+(H.pose==='sit'&&H.x>220?-6:0),()=>drawHuman(t)]);
 let ck=cat.elev?(cat.elev==='lap'?(H.inBed?201:H.y+1):(cat.elev==='bed'||cat.elev==='sofa'?126:40)):cat.y;if(cat.jump)ck=Math.max(cat.y,cat.jump.y1)+0.5;
 ents.push([ck,()=>drawCat(t)]);
 ents.push([dog.y+.2,()=>drawDog(t)]);
 ents.push([ball?ball.floor+.1:0,drawBall]);ents.push([200,drawCup]);
 ents.sort((a,b)=>a[0]-b[0]);for(const e of ents)e[1]();
 drawParticles();
 drawLighting(t);
 drawIconBubble(t);
}

// ---------- UI ----------
const $=id=>document.getElementById(id);
const NEED_LABEL=[['hunger','Busog'],['energy','Energy'],['fun','Saya'],['hygiene','Linis ng katawan'],['social','Lambing'],['tidy','Ayos ng bahay']];
$('needs').innerHTML=NEED_LABEL.map(([k,l])=>`<div class="need"><span>${l}</span><div class="bar"><i id="n-${k}"></i></div><span id="v-${k}">0</span></div>`).join('');
function traitText(){const a=[];a.push(traits.neat>.62?'malinis sa bahay':traits.neat<.35?'medyo burara':'malinis pag may bisita');if(traits.foodie>.55)a.push('foodie');a.push(traits.owl?'night owl':'maagang natutulog (kunwari)');if(traits.drama>.6)a.push('iyakin sa K-drama');
 const fv=favs.map(id=>DISHES.find(d=>d.id===id).name);return a.join(' · ')+`. Paborito niya ang ${fv[0]} at ${fv[1]}.`}
function updateUI(){
 $('clock').textContent=hhmm();
 $('weather').textContent=WEATHER_LABEL[weather.type]+(nowDate().getMonth()>=8?' · ber months na':'');
 $('sub').textContent=`Day ${dayNum()} kasama mo · kasama sina ${CAT} at ${DOG}`;
 $('activity').textContent=H.label;$('thought').textContent=thoughtText;
 $('mood').textContent='mood: '+moodLabel();
 const cr=craving&&DISHES.find(d=>d.id===craving);$('craving').textContent='craving: '+(cr?cr.name:'wala, kuntento');
 for(const [k] of NEED_LABEL){const v=Math.round(k==='tidy'?tidiness():needs[k]);const el=$('n-'+k);el.style.width=v+'%';el.className=v<30?'low':v<60?'mid':'';$('v-'+k).textContent=v}
 $('fridge').innerHTML=Object.keys(INV_LABEL).map(k=>`<span class="chip${inv[k]>0?'':' out'}">${INV_LABEL[k]} ${inv[k]}</span>`).join('');
 $('traits').textContent=traitText();
}
function placeBubble(){
 if(bubbleT<=0){bubbleEl.classList.add('fade');return}
 const r=cv.getBoundingClientRect(),sr=$('stage').getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H_);const ox=r.left-sr.left+(r.width-W*sc)/2,oy=r.top-sr.top+(r.height-H_*sc)/2;
 let bx,by;
 if(bubbleOwner==='human'){if(!H.visible){bx=H.x<40?14:H.x>290?300:H.x;by=60}else{bx=H.x;by=H.y+H.dy-(H.pose==='lie'?18:H.pose==='sit'?28:33)}}
 bx=clamp(bx,30,290);
 bubbleEl.style.left=(ox+bx*sc)+'px';bubbleEl.style.top=(oy+by*sc-14)+'px';
}

$('knockBtn').onclick=knock;$('giftBtn').onclick=leaveGift;
cv.addEventListener('click',clickCanvas);
document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll('.speed button').forEach(x=>x.classList.toggle('on',x===b))});
let wakeLock=null;
$('zenBtn').onclick=async()=>{const on=document.body.classList.toggle('zen');$('zenBtn').textContent=on?'Ipakita ang panel':'Zen mode';try{if(on&&navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen');else if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}};
$('fsBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('stage').requestFullscreen()}catch(e){$('zenBtn').click()}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('zen'))$('zenBtn').click()});

// ---------- catch-up on load ----------
const lastSave=saved.lastSave||0;
if(!saved.lastSave){log(`Lumipat na si ${NAME} sa bagong studio kasama sina ${CAT} at ${DOG}. Welcome home!`)}
else{const gap=(Date.now()-lastSave)/1000;if(gap>600){for(const k in DECAY)if(k!=='energy')needs[k]=Math.max(30,needs[k]-DECAY[k]*Math.min(gap,3*3600));
 log(pick([`Welcome back! Habang wala ka, kinausap ni ${NAME} si ${DOG} tungkol sa buhay niya.`,`Bumalik ka! May naiwan pa sanang pagkain... wala na.`,`Welcome back! Si ${CAT} hindi ka napansin. Si ${DOG}, sobra.`,'Bumalik ka! Medyo makalat na ulit. Wag mo nang itanong.']))}}
if(isSleepTime()){H.x=282;H.y=113}
renderLog();chooseNext();updateUI();

// ---------- loop ----------
let last=performance.now(),uiT=0,saveT=0;
function step(sdt,rdt){updateWorld(sdt,rdt);updateHuman(sdt);updateCat(sdt);updateDog(sdt)}
function frame(now){
 let rdt=(now-last)/1000;last=now;
 if(rdt>1){catchingUp=true;let sim=Math.min(rdt*speed,3600);while(sim>0){const d=Math.min(.5,sim);step(d,d/speed);sim-=d}catchingUp=false;rdt=0.016}
 rdt=Math.min(rdt,.1);const sdt=rdt*speed;
 step(sdt,rdt);updateParticles(rdt);
 bubbleT-=rdt;
 render(now/1000);
 placeBubble();
 uiT-=rdt;if(uiT<=0){uiT=.5;updateUI()}
 saveT-=rdt;if(saveT<=0){saveT=15;save()}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.__studio={setHour(h){const d=new Date();const tgt=new Date(d);tgt.setHours(Math.floor(h),Math.round((h%1)*60),0,0);timeOffset=tgt-d},H,cat,dog,needs,force(n){({cook:planCook,desk:planDesk,nap:planNap,videoke:planVideoke,petcat:planPetCat,playdog:planPlayDog,drama:planDrama,grocery:planGrocery,shower:planShower,tidy:planTidy})[n]()},setSpeed(s){speed=s},mess,get weather(){return weather},setWeather(t){weather.type=t}};
})();
</script>
