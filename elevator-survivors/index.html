<title>Elevator Survivors</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=VT323&display=swap">
<style>
/* Layout: a night-mode messenger. Thread list on the left, chat on the right; on phones one pane at a time. The only ornament is the elevator's amber floor indicator. Deliberately single dark theme: it is always 11:47 PM here. */
:root{
  --bg:#0c0f14; --panel:#131820; --panel-2:#1a2029; --line:#252d39; --ink:#e7ebf0; --muted:#8b95a3; --dim:#5d6775;
  --led:#ffb547; --led-dim:#5a3d12; --me:#2c6e63; --me-ink:#eafaf6; --danger:#e5737a;
  --c-lorna:#f2a5c0; --c-jerome:#86b6ff; --c-nix:#b4b0d6; --c-tonyo:#d2bb83; --c-bambi:#ffd36b; --c-sol:#ffb796;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --led-font:"VT323","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden}
button{font-family:var(--body);color:var(--ink);cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--led);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- onboarding ---------- */
.intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50;overflow-y:auto;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro-inner{width:100%;max-width:560px;display:flex;flex-direction:column;gap:22px;margin:auto}
.led-panel{align-self:flex-start;display:flex;align-items:center;gap:10px;background:#07090c;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-family:var(--led-font);font-size:26px;color:var(--led);text-shadow:0 0 8px rgba(255,181,71,.55);letter-spacing:2px}
.led-panel .arrow{font-size:18px}
.intro h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,7vw,44px);line-height:1.02;margin:0;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:60ch}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input{font:inherit;font-size:20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink)}
.btn{background:var(--led);color:#1d1305;border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.origins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.origins{grid-template-columns:minmax(0,1fr)}}
.origin{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.origin:hover{border-color:#3a4554}
.origin.on{border-color:var(--led);box-shadow:0 0 0 1px var(--led)}
.origin b{font-family:var(--display);font-size:18px;font-weight:700}
.origin .meta{font-size:12px;color:var(--led);letter-spacing:.6px;text-transform:uppercase;font-weight:600}
.origin span{color:var(--muted);font-size:14px}
.prologue{min-height:60vh;display:flex;flex-direction:column;justify-content:center;gap:14px;cursor:pointer}
.pline{font-size:clamp(18px,4.4vw,22px);line-height:1.45;margin:0;animation:fadein .9s ease both;max-width:34ch}
.pline.quiet{color:var(--muted);font-size:16px}
.pline.time{font-family:var(--led-font);color:var(--led);font-size:28px;letter-spacing:2px;text-shadow:0 0 8px rgba(255,181,71,.5)}
.tap{color:var(--dim);font-size:13px;margin-top:10px}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.notif{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;animation:fadein .8s ease both;max-width:420px}
.notif .ic{width:40px;height:40px;border-radius:10px;background:#07090c;display:grid;place-items:center;font-family:var(--led-font);color:var(--led);font-size:22px;flex:none}
.notif b{display:block;font-size:14px}
.notif span{font-size:13px;color:var(--muted)}

/* ---------- app shell ---------- */
.app{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr)}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}.app.in-thread .side{display:none}.app:not(.in-thread) .main{display:none}}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding-left:env(safe-area-inset-left,0px)}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 10px}
.side-top h2{font-family:var(--display);font-size:20px;margin:0;font-weight:700}
.floor{font-family:var(--led-font);font-size:22px;color:var(--led);background:#07090c;border:1px solid var(--line);border-radius:5px;padding:1px 9px;text-shadow:0 0 6px rgba(255,181,71,.5);letter-spacing:1px;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.floor.glitch{color:#ff6b6b;text-shadow:0 0 10px rgba(255,80,80,.7)}
.threads{overflow-y:auto;flex:1;padding:4px 8px 12px;display:flex;flex-direction:column;gap:2px}
.th{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:10px;border:0;background:transparent;text-align:left;width:100%}
.th:hover{background:var(--panel-2)}
.th.on{background:#1e2531}
.th .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .pv{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11px;color:var(--dim)}
.badge{background:var(--led);color:#1d1305;font-weight:700;font-size:11px;border-radius:999px;min-width:19px;height:19px;padding:0 5px;display:grid;place-items:center}
.th.unread .pv{color:var(--ink)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;color:#11151b;flex:none;position:relative}
.av.sm{width:30px;height:30px;font-size:13px}
.av svg{width:100%;height:100%;display:block;border-radius:50%}
.builder{display:grid;grid-template-columns:140px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:520px){.builder{grid-template-columns:minmax(0,1fr)}.builder .pv-big{justify-self:center}}
.pv-big{width:140px;height:140px;border-radius:50%;box-shadow:0 0 0 1px var(--line),0 14px 30px -14px rgba(0,0,0,.8)}
.pv-big svg{width:100%;height:100%;display:block;border-radius:50%}
.opts{display:flex;flex-direction:column;gap:14px;min-width:0}
.og{display:flex;flex-direction:column;gap:7px}
.og>span{font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:600}
.og>div{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{border-color:var(--ink)}
.chipb{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted)}
.chipb.on{background:var(--led);border-color:var(--led);color:#1d1305;font-weight:600}
.voice.playing .bars i{animation:wv .9s ease-in-out infinite;background:var(--ink)}
.voice.playing .bars i:nth-child(3n){animation-delay:.15s}.voice.playing .bars i:nth-child(3n+1){animation-delay:.3s}
@keyframes wv{50%{transform:scaleY(.45)}}
.call{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
  background:radial-gradient(120% 70% at 50% 18%,#1c2633 0%,#0b0e13 62%,#07090c 100%);
  padding:calc(36px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.call-top{display:flex;flex-direction:column;align-items:center;gap:10px}
.call-av{width:132px;height:132px;border-radius:50%;position:relative}
.call-av svg{width:100%;height:100%;border-radius:50%;display:block}
.call.ringing .call-av::before,.call.ringing .call-av::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--led);opacity:0;animation:ring 1.8s ease-out infinite}
.call.ringing .call-av::after{animation-delay:.9s}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.call-name{font-family:var(--display);font-size:28px;font-weight:700;margin:6px 0 0}
.call-status{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.call-mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;width:100%;max-width:440px;padding:18px 0}
.call-sub{font-size:17px;line-height:1.5;color:var(--ink);min-height:3em;text-wrap:pretty}
.call-sub.dim{color:var(--muted);font-style:italic}
.call-choices{display:flex;flex-direction:column;gap:8px}
.call-choices button{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;text-align:left;animation:fadein .4s ease both}
.call-choices button:hover{background:rgba(255,181,71,.12);border-color:var(--led)}
.call-btns{display:flex;gap:56px;justify-content:center}
.cbtn{width:68px;height:68px;border-radius:50%;border:0;font-size:26px;color:#fff;display:grid;place-items:center}
.cbtn.ok{background:#2fb36d}.cbtn.no{background:#e0484f}
.cbtn-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.callback{align-self:center;display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13.5px;color:var(--muted)}
.callback button{background:#2fb36d;border:0;border-radius:999px;padding:6px 12px;color:#fff;font-weight:600;font-size:13px}
.calllog{display:flex;justify-content:space-between;align-items:center;gap:10px}
.calllog button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--ink)}
.av.gc{background:#07090c;color:var(--led);font-family:var(--led-font);font-size:22px;border:1px solid var(--line)}
.av .dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#43c28a;border:2px solid var(--panel)}
.side-foot{display:flex;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.side-foot button{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;color:var(--muted)}

.main{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel);
  padding-right:max(12px,env(safe-area-inset-right,0px))}
.chat-head .back{display:none;background:transparent;border:0;font-size:22px;padding:4px 8px;color:var(--muted)}
@media (max-width:760px){.chat-head .back{display:block}}
.chat-head .ti{flex:1;min-width:0}
.chat-head .ti b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .ti span{font-size:12px;color:var(--muted)}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
.notice{font-size:12.5px;color:var(--muted);background:var(--panel);border-bottom:1px solid var(--line);padding:7px 14px;text-align:center}
.notice[hidden]{display:none}
.msgs{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:2px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.day{align-self:center;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;margin:14px 0 8px;font-weight:600}
.sys{align-self:center;font-size:12.5px;color:var(--muted);margin:6px 0;text-align:center;max-width:80%}
.newline{align-self:stretch;display:flex;align-items:center;gap:10px;color:var(--led);font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:10px 0}
.newline::before,.newline::after{content:"";flex:1;height:1px;background:var(--led-dim)}
.row{display:flex;gap:8px;align-items:flex-end;max-width:min(78%,560px)}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.row .avs{width:30px;flex:none}
.stack{display:flex;flex-direction:column;gap:2px;min-width:0}
.row.me .stack{align-items:flex-end}
.who{font-size:12px;font-weight:700;margin:8px 0 2px 4px}
.b{background:var(--panel-2);padding:8px 12px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.row.me .b{background:var(--me);color:var(--me-ink)}
.b .tm{display:none;font-size:11px;color:var(--dim);margin-left:8px}
.b:hover .tm,.b:focus .tm{display:inline}
.row.me .b .tm{color:#b9e6dc}
.voice{display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:190px}
.voice .wave{display:flex;align-items:center;gap:8px}
.voice .play{width:28px;height:28px;border-radius:50%;background:var(--c-tonyo);color:#11151b;display:grid;place-items:center;font-size:12px;flex:none}
.voice .bars{display:flex;gap:2px;align-items:center;height:22px;flex:1}
.voice .bars i{display:block;width:3px;border-radius:2px;background:var(--muted)}
.voice .dur{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.voice .tx{font-size:13.5px;color:var(--muted);font-style:italic}
.typing{min-height:22px;font-size:12.5px;color:var(--muted);padding:0 16px 4px}
.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin-left:3px;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.composer textarea{flex:1;min-width:0;resize:none;font:inherit;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:10px 14px;color:var(--ink);max-height:120px;line-height:1.35}
.composer button{background:var(--led);color:#1d1305;border:0;border-radius:50%;width:42px;height:42px;font-size:18px;font-weight:700;flex:none}
.composer button:disabled{opacity:.35}
.left-note{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line);background:var(--panel)}

/* drawers */
.drawer{position:fixed;inset:0;background:rgba(4,6,9,.6);z-index:40;display:flex;justify-content:flex-end}
.drawer-in{width:min(380px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px;gap:14px;overflow-y:auto}
.drawer h3{font-family:var(--display);margin:0;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.drawer h3 button{background:transparent;border:0;color:var(--muted);font-size:22px}
.mem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.mem b{font-size:15px;display:block}
.mem span{font-size:12.5px;color:var(--muted)}
.mem .add{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px}
.clue{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.clue small{display:block;color:var(--dim);font-size:11.5px;margin-bottom:3px;letter-spacing:.6px;text-transform:uppercase}
.empty{color:var(--muted);font-size:14px}
.danger{background:transparent;border:1px solid #5a2a2e;color:var(--danger);border-radius:8px;padding:8px 12px;align-self:flex-start}
.flash{animation:flash .9s ease}
@keyframes flash{0%{filter:none}20%{filter:brightness(.25) contrast(1.4)}40%{filter:none}55%{filter:brightness(.4)}100%{filter:none}}
</style>

<div id="intro" class="intro" hidden></div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="side-top"><h2>Mga Chat</h2><div class="floor" id="floor" title="Elevator 2">▲ 1</div></div>

<script>
'use strict';
// =====================================================================
//  ELEVATOR SURVIVORS
//  Spoiler warning: the STORY BIBLE below is the secret truth of the
//  story. The player isn't meant to read it.
// =====================================================================

const CAST = {
  lorna:{name:'Tita Lorna',short:'Lorna',init:'L',color:'var(--c-lorna)',age:58,
    sheet:`58, babae, retired public school teacher, biyuda, nakatira mag-isa sa Pasig. Gumawa ng GC. Mother hen: "anak" ang tawag sa lahat, "po" kahit sa mas bata, maraming 🙏😊😢, "..." sa dulo, at minsan biglang ALL CAPS na voice-to-text na sablay ("NIX ANAK KUMAIN KA NA BA PERIOD"). Nagpapadala ng good morning na may bulaklak (ilarawan lang bilang "[good morning image: rosas, 'Blessed Tuesday!']"). PINAKAMADUMI MAGBIRO sa buong GC pero inosente ang delivery at may 🙏 pa ("ang laki naman nyan anak 🙏 yung ulam ha"). Malambing kay Nix, parang lola. Hindi umaamin na takot siya.
SINABI NIYA: galing siya sa dentista sa 3F (pustiso emergency). TOTOO: pumunta siya sa building dahil may nakita siyang address sa lumang sulat ng anak niyang si Migs (31), na anim na taon na niyang hindi kinakausap matapos ang malaking away tungkol sa pagkatao ni Migs (bakla si Migs; hindi siya pumunta sa kasal nito sa Taiwan). Gusto na niyang humingi ng tawad pero hindi niya alam paano. Hindi na nakatira doon si Migs.
SA ELEVATOR NAKITA NG IBA: si Lorna sa isang airport, hawak ang regalo, hindi lumalapit.
WANT: mapatawad. Masarap magluto. Nanonood ng Kdrama. Takot sa katahimikan ng bahay niya.
AFTER-EFFECT: naaamoy niya ang sampaguita tuwing 11:47 PM.`},
  jerome:{name:'Jerome',short:'Jerome',init:'J',color:'var(--c-jerome)',age:34,
    sheet:`34, lalaki, team lead sa Northgate Solutions (BPO, 7F, night shift). Manyak ang demeanor: malandi, may innuendo sa lahat, "pakshet", "pre", 😏🔥, nagko-comment sa itsura, feeling alpha, mayabang, defensive. Medyo cringe pero minsan nakakatawa talaga. Sumusulat nang may tamang capitalization pero walang ingat sa punctuation. Akala niya kakampi niyang "lalaki" si Bambi at gusto niyang wingman ito. Asar kay Bambi pag binabalik nito ang landi niya.
SINABI NIYA: may "meeting" lang sa taas. TOTOO: kanya ang unit 1408. Hiwalay na sila ng asawa niyang si Karen nang tatlong taon pero kasal pa sila on paper dahil hindi niya kaya ang annulment (₱300k+). Walang pangloloko. Hindi niya ito ipinapaliwanag; mas gusto niyang isipin ng iba na playboy siya kaysa malaman na malungkot at bigo siya.

function builderHTML(a){
  const sw=(k,list)=>list.map(c=>`<button type="button" class="sw${a[k]===c?' on':''}" style="background:${c}" data-k="${k}" data-v="${c}" aria-label="${c}"></button>`).join('');
  const ch=(k,obj)=>Object.entries(obj).map(([v,l])=>`<button type="button" class="chipb${a[k]===v?' on':''}" data-k="${k}" data-v="${v}">${l}</button>`).join('');
  const ac=Object.entries(ACCS).map(([v,l])=>`<button type="button" class="chipb${(a.acc||[]).includes(v)?' on':''}" data-acc="${v}">${l}</button>`).join('');
  return `<div class="builder"><div class="pv-big">${avatarSVG(a)}</div><div class="opts">
    <div class="og"><span>Balat</span><div>${sw('skin',SKIN)}</div></div>
    <div class="og"><span>Buhok</span><div>${ch('hair',HAIRS)}</div></div>
    <div class="og"><span>Kulay ng buhok</span><div>${sw('hairC',HAIRC)}</div></div>
    <div class="og"><span>Mukha</span><div>${ch('face',FACES)}</div></div>
    <div class="og"><span>Damit</span><div>${sw('top',TOPC)}</div></div>
    <div class="og"><span>Background</span><div>${sw('bg',BGC)}</div></div>
    <div class="og"><span>Extras</span><div>${ac}</div></div></div></div>`;
}
function mountBuilder(root,a){
  const draw=()=>{root.innerHTML=builderHTML(a);
    root.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{a[b.dataset.k]=b.dataset.v;draw()});
    root.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{const v=b.dataset.acc;a.acc=a.acc||[];
      if(a.acc.includes(v))a.acc=a.acc.filter(x=>x!==v);else{a.acc.push(v);if(v==='helmet')a.acc=a.acc.filter(x=>x!=='cap'&&x!=='hood');if(v==='cap'||v==='hood')a.acc=a.acc.filter(x=>x!=='helmet'&&(v==='cap'?x!=='hood':x!=='cap'))}draw()})};
  draw();
}

const BIBLE = `ANG TOTOO (lihim, hindi kailanman sasabihin nang diretso):
Ang Galvez Tower (Makati, itinayo 1979, 22 palapag) ay walang 13th floor. Sa panel ng Elevator 2, may blangkong espasyo sa pagitan ng 12 at 14. Paminsan-minsan, tuwing 11:47 PM, ang Elevator 2 ay humihinto "sa pagitan": isang lugar na parang dilaw na hallway na puno ng pintong 13XX, kung saan nakikita ng mga tao ang pinakamabigat na tinatago nila at ng mga kasama nila. Hindi tumatakbo ang oras doon nang pareho. Noong 2009, si Paolo Reyes (15) ay naiwan doon. Sa gabi ng insidente, walo talaga sila sa loob: ang ikawalo ay si Paolo, na naka-school uniform, nakaupo sa sulok, at hindi pa rin tumatanda. Ilan lang ang nakakaalala sa kanya, malabo.
Nawala ang anim (at ang player) mula 11:47 PM hanggang 2:47 AM. Walang brownout ayon sa Meralco. Walang record ang building admin ng anumang stall. Walang CCTV ng kahit ano. Para silang nawala sa mundo.
Ang player ay nakarating na roon DATI, at hindi niya ito naaalala. Kilala siya ni Paolo. Ito ang dahilan kung bakit ayaw sabihin ng iba sa player ang nakita nila tungkol sa kanya. Si Sol ang may pinakamaraming hinala tungkol dito.
Panuntunan ng misteryo: HUWAG KAILANMAN kumpirmahin kung supernatural, sci-fi o sikolohikal ito. Dapat palaging may posibleng ordinaryong paliwanag at posibleng hindi. Pinagtatalunan ito ng grupo (si Jerome ang skeptic, si Lorna ang relihiyosa, si Bambi ang excited, si Nix ang tahimik na naniniwala, si Sol ang parang may alam). Dahan-dahan ang mga reveal. Mas importante ang tao kaysa sa misteryo.
Mga karaniwang after-effect: naririnig ng lahat ang "ding" ng elevator tuwing 11:47 PM saan man sila; tatlong minutong late ang mga orasan nila; minsan nahuhuli ang repleksyon nila sa salamin; panaginip ng dilaw na hallway.`;

function playPrologue(){
  const I=$('intro');const L=prologueLines();let i=0;

  const pro=$('pro');
  const step=()=>{
    if(i>=L.length){finishPrologue();return}
    if(pro.children.length>=4)pro.innerHTML='';
    const p=document.createElement('p');p.className='pline'+(L[i].c?' '+L[i].c:'');p.textContent=L[i].t;pro.appendChild(p);i++;
  };
  pro.onclick=step;pro.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();step()}};
  $('skip').onclick=finishPrologue;step();pro.focus();
}

function fmtTime(t){return new Date(t).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})}
function dayLabel(t){const d=new Date(t),n=new Date();const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());const diff=Math.round((b-a)/DAY);
  if(diff===0)return 'Ngayon';if(diff===1)return 'Kahapon';return ['Linggo','Lunes','Martes','Miyerkules','Huwebes','Biyernes','Sabado'][d.getDay()]+', '+d.toLocaleDateString('en-PH',{month:'short',day:'numeric'})}
function fmtShort(t){const l=dayLabel(t);return l==='Ngayon'?fmtTime(t):l==='Kahapon'?'Kahapon':l.split(',')[0]}

function renderChat(scroll){
  const t=S.active;const box=$('msgs');
  $('headAv').innerHTML=avHTML(t,false);$('headTitle').textContent=threadTitle(t);
  if(t==='gc'){const n=1+IDS.filter(id=>id!=='tonyo'||S.tonyoIn).length;$('headSub').textContent=n+' members';$('btnMembers').hidden=false}
  else{$('headSub').textContent=isOnline(t)?'Active now':CAST[t].age+' · '+(t==='tonyo'?'guard, Galvez Tower':'Elevator 2 survivor');$('btnMembers').hidden=true}
  const nf=(S.newFrom||{})[t]||0;
  let html='',lastDay='',lastFrom='',shownNew=false;
  for(const m of S.threads[t]){
    const dl=dayLabel(m.t);if(dl!==lastDay){html+=`<div class="day">${dl}</div>`;lastDay=dl;lastFrom=''}
    if(nf&&!shownNew&&m.t>=nf&&m.from!=='me'){html+=`<div class="newline">Bagong mensahe</div>`;shownNew=true;lastFrom=''}
    if(m.from==='sys'){html+=`<div class="sys">${esc(m.text)}</div>`;lastFrom='';continue}
    const me=m.from==='me',c=CAST[m.from];
    const first=m.from!==lastFrom;lastFrom=m.from;
    const body=m.voice?voiceHTML(m):esc(m.text);
    html+=`<div class="row${me?' me':''}">${me?'':`<div class="avs">${first?avHTML(m.from,true):''}</div>`}<div class="stack">${!me&&first&&t==='gc'?`<div class="who" style="color:${c.color}">${esc(c.name)}</div>`:''}<div class="b" tabindex="-1">${body}<span class="tm">${fmtTime(m.t)}</span></div></div></div>`;
  }
  if(t!=='gc'&&Object.keys(CALLS).some(k=>CALLS[k].from===t&&(S.calls||{})[k]&&S.calls[k].state==='missed'))
    html+=`<div class="callback">Tumawag si ${esc(CAST[t].short)} kanina.<button type="button" id="cbBtn">Tawagan pabalik</button></div>`;
  if(!S.threads[t].length)html=`<div class="sys" style="margin-top:30vh">Pribadong usapan ninyo ni ${esc(CAST[t].name)}. Walang ibang makakabasa nito.</div>`;
  box.innerHTML=html;
  const cb=$('cbBtn');if(cb)cb.onclick=()=>callBack(t);
  box.querySelectorAll('.voice').forEach(v=>{v.onclick=()=>playVoice(v);v.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();playVoice(v)}}});
  S.unread[t]=0;
  renderComposer();renderTyping();
  if(scroll){const nl=box.querySelector('.newline');if(nl)nl.scrollIntoView({block:'start'});else box.scrollTop=box.scrollHeight}
  noticeUpdate();
}
function voiceHTML(m){
  const n=26,seed=m.id.length+m.text.length;let bars='';
  for(let i=0;i<n;i++){const h=5+Math.abs(Math.sin(seed*1.7+i*1.3))*15;bars+=`<i style="height:${h.toFixed(0)}px"></i>`}
  const d=m.voice|0;return `<div class="voice${speakingId===m.id?' playing':''}" role="button" tabindex="0" data-id="${m.id}" data-from="${m.from}" aria-label="Voice message ni ${esc(CAST[m.from].short)}. Pindutin para pakinggan."><div class="wave"><span class="play" style="background:${CAST[m.from].color}">${speakingId===m.id?'■':'▶'}</span><span class="bars">${bars}</span><span class="dur">${Math.floor(d/60)}:${String(d%60).padStart(2,'0')}</span></div><div class="tx" hidden>"${esc(m.text)}"</div></div>`;
}
function renderComposer(){
  const w=$('composerWrap');const t=S.active;

let ttsFn=null,speakingId=null;
const VOICE={lorna:{voice:'airy',rate:.95},jerome:{voice:'rounded',rate:1.06},nix:{voice:'glassy',rate:.94},tonyo:{voice:'rounded',rate:.82},bambi:{voice:'glassy',rate:1.12},sol:{voice:'buttery',rate:.92}};
function speechText(t){return String(t).replace(/\[[^\]]*\]/g,' ').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/—/g,', ').replace(/\s+/g,' ').trim().slice(0,1900)}
function markVoices(){document.querySelectorAll('.voice').forEach(v=>{const on=v.dataset.id===speakingId;v.classList.toggle('playing',on);v.querySelector('.play').textContent=on?'■':'▶'})}
function playVoice(v){
  const tx=v.querySelector('.tx');const id=v.dataset.id;
  const m=S.threads[S.active].find(x=>x.id===id);if(!m)return;
  if(speakingId===id){AU.pause();try{ttsFn&&ttsFn.stop()}catch(e){};speakingId=null;markVoices();return}
  if(m.audio){tx.hidden=false;try{ttsFn&&ttsFn.stop()}catch(e){};speakingId=id;markVoices();
    playClip(m.audio).then(()=>{if(speakingId===id){speakingId=null;markVoices()}});return}
  if(!ttsFn){tx.hidden=!tx.hidden;return}
  tx.hidden=false;
  speakingId=id;markVoices();
  ttsFn.speak(speechText(m.text),VOICE[m.from]||{}).catch(e=>{if(e&&e.code==='not_granted'){ttsFn=null;setNotice('Naka-off ang boses. Basahin na lang ang transcript.');setTimeout(()=>setNotice(''),8000)}}).finally(()=>{if(speakingId===id){speakingId=null;markVoices()}});
}

const AU=new Audio();AU.preload='auto';
let clipDone=null;
function playClip(key){
  return new Promise(res=>{
    if(clipDone)clipDone();
    let done=false;const fin=()=>{if(done)return;done=true;clipDone=null;AU.onended=AU.onerror=null;res()};clipDone=fin;
    AU.onended=fin;AU.onerror=()=>setTimeout(fin,2500);
    AU.src='audio/'+key+'.mp3';
    const p=AU.play();if(p&&p.catch)p.catch(()=>setTimeout(fin,2500));
  });
}

addEventListener('pointerdown',()=>{userActed=true;unlockAudio()},{once:false,passive:true});

let actx=null;function unlockAudio(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
let ringTimer=null;
function ringTone(on){
  clearInterval(ringTimer);ringTimer=null;if(!on||!actx)return;
  const beep=()=>{try{const t=actx.currentTime;[0,.45].forEach(o=>{const g=actx.createGain();g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.06,t+o+.03);g.gain.linearRampToValueAtTime(0,t+o+.38);g.connect(actx.destination);
    [440,480].forEach(f=>{const os=actx.createOscillator();os.frequency.value=f;os.connect(g);os.start(t+o);os.stop(t+o+.4)})});if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}};
  beep();ringTimer=setInterval(beep,2600);
}

let CALL=null;
function fmtDur(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function callShell(c,status){
  const el=$('call');const ch=CAST[c.from];
  el.innerHTML=`<div class="call-top"><div class="call-av">${avatarSVG(AV[c.from])}</div><div class="call-name">${esc(ch.name)}</div><div class="call-status" id="cStatus">${esc(status)}</div></div>

  el.hidden=false;
}
function ring(id,opts={}){
  const c=CALLS[id];if(!c||CALL)return;
  CALL={id,c,path:[],started:0,replay:false};
  callShell(c,opts.back?'Tumatawag…':'Incoming call…');
  $('call').classList.add('ringing');
  $('cSub').textContent=opts.back?'':'Elevator Survivors 🙏';
  if(opts.back){$('cBtns').innerHTML='';setTimeout(()=>answer(),2200);return}
  $('cBtns').innerHTML=`<div class="cbtn-wrap"><button class="cbtn no" id="cNo" type="button" aria-label="Tanggihan">✕</button>Decline</div><div class="cbtn-wrap"><button class="cbtn ok" id="cOk" type="button" aria-label="Sagutin">✆</button>Accept</div>`;
  $('cOk').onclick=answer;$('cNo').onclick=()=>miss('declined');$('cOk').focus();
  ringTone(true);
  CALL.ringTO=setTimeout(()=>miss('missed'),32000);
}
function miss(kind){
  if(!CALL)return;const {id,c}=CALL;ringTone(false);clearTimeout(CALL.ringTO);
  S.calls=S.calls||{};S.calls[id]={state:'missed',t:Date.now()};
  push(c.from,{id:nid(),from:'sys',text:'📞 '+(kind==='declined'?'Tinanggihan mo ang tawag ni ':'Missed call mula kay ')+CAST[c.from].name,t:Date.now()});
  closeCall();
}
function answer(){
  if(!CALL)return;ringTone(false);clearTimeout(CALL.ringTO);
  $('call').classList.remove('ringing');$('cBtns').innerHTML=`<div class="cbtn-wrap"><button class="cbtn no" id="cEnd" type="button" aria-label="Ibaba">✕</button>End</div>`;
  $('cEnd').onclick=()=>hangUp();
  CALL.started=Date.now();CALL.tick=setInterval(()=>{const st=$('cStatus');if(st&&CALL)st.textContent=fmtDur(Date.now()-CALL.started)},500);
  playNode(CALL.c.start);
}
function playNode(key){
  if(!CALL)return;const n=CALL.c.nodes[key];CALL.path.push(key);CALL.node=key;
  const sub=$('cSub'),ch=$('cCh');ch.innerHTML='';sub.classList.remove('dim');sub.textContent=n.t;
  const token={};CALL.token=token;
  playClip(n.a).then(()=>{
    if(!CALL||CALL.token!==token)return;
    if(CALL.replay){const nx=CALL.replayPath.shift();if(nx)playNode(nx);else endCall();return}
    if(n.next)return playNode(n.next);
    if(n.end)return endCall();
    ch.innerHTML=n.c.map((o,i)=>`<button type="button" data-i="${i}">${esc(o.t)}</button>`).join('');
    ch.querySelectorAll('button').forEach(b=>b.onclick=()=>{const o=n.c[+b.dataset.i];
      if(o.r)S.rel[CALL.c.from]=(S.rel[CALL.c.from]||0)+o.r;CALL.choices=(CALL.choices||[]).concat(o.t);playNode(o.n)});
    const f=ch.querySelector('button');if(f)f.focus();
  });
}
function hangUp(){
  if(!CALL)return;
  if(CALL.replay){AU.pause();if(clipDone)clipDone();closeCall();return}
  AU.pause();if(clipDone)clipDone();
  CALL.path.push('hangup');S.notes.push('Binabaan ng player si '+CAST[CALL.c.from].name+' sa gitna ng tawag.');
  S.rel[CALL.c.from]=(S.rel[CALL.c.from]||0)-1;endCall();
}
function endCall(){
  if(!CALL)return;const {id,c,path,started,replay}=CALL;clearInterval(CALL.tick);
  const dur=Date.now()-started;
  if(!replay){
    S.calls=S.calls||{};S.calls[id]={state:'done',t:Date.now(),path,dur};
    push(c.from,{id:nid(),from:'sys',text:'📞 Tawag kay '+CAST[c.from].name+' · '+fmtDur(dur),t:Date.now()});
    try{c.onEnd(path)}catch(e){}

  const st=$('cStatus');if(st)st.textContent='Natapos ang tawag · '+fmtDur(dur);

}

function replayCall(id){
  const st=(S.calls||{})[id];if(!st||!st.path||CALL)return;const c=CALLS[id];
  const path=st.path.filter(k=>c.nodes[k]);if(!path.length)return;
  closeDrawer();CALL={id,c,path:[],started:Date.now(),replay:true,replayPath:path.slice(1)};

}

}

// ------------------------------------------------- scheduled delivery (no AI calls)
function deliverDue(){
  if(S.stage!=='chat')return;
  const now=Date.now();const due=S.queue.filter(q=>q.due<=now);if(!due.length)return;
  S.queue=S.queue.filter(q=>q.due>now);
  for(const q of due){
    const thread=q.thread==='pm'?q.from:'gc';
    if(thread==='gc'&&q.from==='tonyo'&&!S.tonyoIn)continue;
    push(thread,{id:nid(),from:q.from,text:q.text,t:Math.min(q.due,now),voice:q.voice||0});
  }
}
setInterval(deliverDue,8000);

// ------------------------------------------------- Claude: the cast
let sampleFn=null,busy=false;const pendingAsk=new Set();let askTimer=null,askNote={};
function scheduleAsk(thread,note){if(note)askNote[thread]=(askNote[thread]?askNote[thread]+'\n':'')+note;pendingAsk.add(thread);clearTimeout(askTimer);askTimer=setTimeout(runAsk,2600)}
function playerSend(thread,text){
  push(thread,{id:nid(),from:'me',text,t:Date.now()});
  if(!sampleFn){offlineReply(thread,text);return}
  scheduleAsk(thread);
}
function offlineReply(thread,text){
  const pool=thread==='gc'?[['lorna','Ay {name} anak 😊 andito ka na pala 🙏'],['bambi','uy'],['nix','ok'],['jerome','Haha oo nga']]:[[thread,thread==='nix'?'ok':thread==='tonyo'?'ok.':'Hi {name} 😊']];
  const [from,msg]=pool[Math.floor(Math.random()*pool.length)];
  showTypingThen(from,thread,P(msg),2500);
}
function showTypingThen(from,thread,text,ms,voice){
  return new Promise(res=>{typingNow[from]=thread;renderTyping();setTimeout(()=>{delete typingNow[from];push(thread,{id:nid(),from,text,t:Date.now(),voice:voice||0});renderTyping();res()},ms)});
}

function fmtLine(m){const who=m.from==='me'?S.name+' (player)':m.from==='sys'?'[system]':CAST[m.from].name;const d=new Date(m.t);
  return `[${dayLabel(m.t)} ${fmtTime(m.t)}] ${who}: ${m.voice?'(voice message) ':''}${m.text}`}

function buildPrompt(mode,thread,extra){
  const o=ORIGINS[S.origin];const d=dayNum();const now=new Date();
  const castTxt=IDS.map(id=>`### ${CAST[id].name} (id: ${id})\n${CAST[id].sheet}\nOras: ${SCHED[id]}\nTiwala sa player: ${S.rel[id]||0} (${relLabel(S.rel[id]||0)})`).join('\n\n');
  const seenTxt=`Ang nakita ng iba tungkol sa player sa elevator (LIHIM, ayaw nilang sabihin sa player; pwede lang magpahiwatig nang malabo, at buong detalye lang kung napakataas na ng tiwala at araw 7 pataas): ${o.seen}.`;
  const gc=S.threads.gc.slice(-45).map(fmtLine).join('\n');
  const pms=IDS.filter(id=>S.threads[id].length).map(id=>{const n=thread===id?30:4;return `--- PM ni ${CAST[id].name} at ng player (huling ${n}) ---\n`+S.threads[id].slice(-n).map(fmtLine).join('\n')}).join('\n\n');
  const beat=BEATS[Math.min(d,BEATS.length)-1];
  let task='';
  if(mode==='reply'){
    task = thread==='gc'
      ? `GAWAIN: Kakasend lang ng player ng mensahe sa GC. Isulat ang susunod na ilang mensahe sa GC (1 hanggang 6). Hindi lahat sasagot; sasagot lang ang gising at may pakialam. Pwedeng mag-usap-usap sila sa isa't isa, hindi lang sa player. Pwedeng may isang mag-PM sa player pagkatapos kung bagay.`
      : `GAWAIN: Kakasend lang ng player ng mensahe kay ${CAST[thread].name} sa PM. Sumagot si ${CAST[thread].name} (1 hanggang 4 na bubble), sa sarili niyang boses. Mas tapat at personal ang tao sa PM kaysa sa GC. Kung tulog o busy siya ayon sa oras niya, pwedeng maikli, o ilagay sa "later" ang sagot.`;
  } else if(mode==='catchup'){
    task = `GAWAIN: Bumalik ang player sa app matapos mawala nang ${extra.gapText}. Isulat ang nangyari sa GC (at mga PM sa player kung bagay) HABANG WALA SIYA, sa "backlog", na may "minutesAgo" (1 hanggang ${extra.gapMin}). Sundin ang oras ng bawat character. Bilang: mga ${extra.count} mensahe sa kabuuan. Ituloy ang mga kwento, may bagong chika, at isulong nang kaunti ang beat ng araw. Huwag puro tungkol sa player. Kung natagalan sumagot ang player sa isang tao, pwedeng may mag-follow up.`;
  }
  if(extra&&extra.note)task+=`\nKONTEKSTO: ${extra.note}`;
  return `Ikaw ang manunulat at nagpapatakbo ng isang interactive na group chat story na "Elevator Survivors". Isusulat mo ang mga mensahe ng mga character. Ang player ay totoong tao na nagta-type bilang ${S.name}.

${BIBLE}

## ANG PLAYER
Pangalan: ${S.name}. Pinanggalingan: ${o.title}. ${o.belief}
${seenTxt}

## CAST
${castTxt}

## KASALUKUYAN
Ngayon: ${dayLabel(now)} ${fmtTime(now)} (oras ng player). Araw ${d} mula sa insidente.
Beat ng araw: ${beat}
Nasa GC si Mang Tonyo: ${S.tonyoIn?'oo':'HINDI (umalis siya; hindi siya pwedeng mag-post sa GC, pero pwede siyang i-PM ng player o siya mismo mag-PM)'}.
Mga natatandaan (notes): ${S.notes.length?S.notes.map(n=>'- '+n).join('\n'):'wala pa'}
Mga clue na alam na ng player: ${S.clues.map(c=>c.text).join(' | ')}

## GC (huling mga mensahe)
${gc||'(wala pa)'}

${pms}

## PARAAN NG PAGSULAT
- Totoong group chat: maiikling bubble, hiwa-hiwalay, Taglish na natural sa Maynila. Bawat character ay may sariling ortograpiya at boses (sundin ang sheet). Si Nix lowercase. Si Sol walang typo. Si Tonyo halos voice messages (voice: bilang ng segundo, 8 hanggang 70). Ang iba ay paminsan-minsan lang mag-voice message: si Lorna pag mahaba ang kwento o nagluluto, si Bambi pag nagmamadali o nakainom, si Jerome pag nasa biyahe. Halos hindi si Nix at Sol (kaya malaking bagay pag ginawa nila). Isulat ang voice message na parang transcript ng totoong pagsasalita: may "ahh", may paputol-putol, may ingay sa background sa [brackets].
- Walang narration, walang *aksyon*, walang stage directions. Text lang na parang tunay na chat. Pwedeng ilarawan ang larawan o sticker sa [brackets].
- May friction, asaran, at tunay na personalidad. Hindi lahat sumasang-ayon sa player. Hindi sila therapist. Puwede ang bastos na biro at mura (R-16 na humor, walang tahasang sex).
- Mabigat minsan, pero ang ulam ay ang mga tao at ang tawanan. Ang misteryo ay pampalasa.
- Dahan-dahan ang mga reveal at nakadepende sa tiwala. Huwag ilabas ang lahat ng lihim. Huwag kailanman kumpirmahin ang totoo.
- Huwag ulitin ang mga linya o biro na nasa history na.
- Ang mga phone call ay scripted at hiwalay sa iyo: HUWAG mag-imbento na may tumawag. Pwedeng banggitin ang isang tawag kung nasa notes na ito.

${task}

## OUTPUT
JSON lang, walang ibang text:
{"now":[{"thread":"gc"|"pm","from":"<id>","text":"...","voice":0}],
 "backlog":[{"thread":"gc"|"pm","from":"<id>","text":"...","voice":0,"minutesAgo":0}],
 "later":[{"thread":"gc"|"pm","from":"<id>","text":"...","voice":0,"inMinutes":0}],
 "rel":{"<id>":0},
 "notes":["maiikling bagong katotohanan na dapat tandaan, kung meron"],
 "clue":null,
 "tonyo":null}
- "now": mga mensaheng darating ngayon (para sa reply mode). "backlog": para sa catchup mode lang. "later": 0 hanggang 3 mensaheng darating sa susunod na 5 hanggang 180 minuto (follow-up, bagong usapan, isang PM), para buhay ang chat kahit hindi nagta-type ang player.
- thread "pm" = pribadong mensahe ng "from" sa player.
- "rel": pagbabago ng tiwala (-3 hanggang +3) ng mga character na naapektuhan ng ginawa ng player ngayon; {} kung wala.
- "clue": isang pangungusap kung may bagong mahalagang detalye na natuklasan ng player ngayon, kung hindi null. Bihira lang.
- "tonyo": "leave" o "join" kung umalis o bumalik si Tonyo sa GC ngayon, kung hindi null.
- ids: lorna, jerome, nix, tonyo, bambi, sol.`;
}

async function callCast(prompt){
  const r=await sampleFn.json(prompt,{modelTier:'default',cache:false});
  return r&&typeof r==='object'?r:{};
}
function setNotice(t){const n=$('notice');n.textContent=t||'';n.hidden=!t}
function noticeUpdate(){}

async function runAsk(){
  if(busy){clearTimeout(askTimer);askTimer=setTimeout(runAsk,3000);return}
  const threads=[...pendingAsk];pendingAsk.clear();if(!threads.length)return;
  busy=true;
  // rough "someone's typing" while Claude thinks
  const thinkers=threads.map(t=>t==='gc'?pickLikely():t);
  threads.forEach((t,i)=>{typingNow[thinkers[i]]=t});renderTyping();
  try{
    for(const thread of threads){
      const note=askNote[thread];delete askNote[thread];
      const res=await callCast(buildPrompt('reply',thread,{note}));
      threads.forEach((t,i)=>{if(typingNow[thinkers[i]]===t)delete typingNow[thinkers[i]]});renderTyping();
      await applyResult(res,'reply');
    }
  }catch(e){handleErr(e)}
  finally{busy=false;Object.keys(typingNow).forEach(k=>delete typingNow[k]);renderTyping();save()}
}
function pickLikely(){const on=IDS.filter(id=>isOnline(id)&&(id!=='tonyo'||S.tonyoIn)&&id!=='tonyo');return on[Math.floor(Math.random()*on.length)]||'lorna'}
function validFrom(f){return IDS.includes(f)}
async function applyResult(res,mode){
  const now=Date.now();
  if(res.rel&&typeof res.rel==='object')for(const[k,v]of Object.entries(res.rel))if(validFrom(k)&&typeof v==='number')S.rel[k]=Math.max(-10,Math.min(30,(S.rel[k]||0)+Math.max(-3,Math.min(3,v))));
  if(Array.isArray(res.notes))for(const n of res.notes)if(typeof n==='string'&&n.trim()){S.notes.push(n.trim().slice(0,200));}
  if(S.notes.length>45)S.notes.splice(0,S.notes.length-45);
  if(typeof res.clue==='string'&&res.clue.trim())addClue(res.clue.trim().slice(0,240));
  if(res.tonyo==='leave'&&S.tonyoIn){S.tonyoIn=false;sysMsg('gc','Mang Tonyo left the group.')}
  if(res.tonyo==='join'&&!S.tonyoIn){S.tonyoIn=true;sysMsg('gc','Mang Tonyo joined the group.')}
  if(Array.isArray(res.later))for(const m of res.later.slice(0,3)){if(!validFrom(m.from)||!m.text)continue;const mins=Math.max(3,Math.min(240,+m.inMinutes||30));S.queue.push({due:now+mins*MIN,thread:m.thread==='pm'?'pm':'gc',from:m.from,text:String(m.text),voice:+m.voice||0})}
  if(S.queue.length>12)S.queue=S.queue.sort((a,b)=>a.due-b.due).slice(0,12);
  if(mode==='catchup'&&Array.isArray(res.backlog)){
    const gapMin=Math.max(1,Math.round((now-(S.lastSeenBefore||now))/MIN));
    for(const m of res.backlog){if(!validFrom(m.from)||!m.text)continue;
      const thread=m.thread==='pm'?m.from:'gc';if(thread==='gc'&&m.from==='tonyo'&&!S.tonyoIn)continue;
      const ago=Math.max(1,Math.min(gapMin,+m.minutesAgo||1));
      push(thread,{id:nid(),from:m.from,text:String(m.text),t:now-ago*MIN+Math.random()*20e3,voice:+m.voice||0},{quiet:true});}
    renderThreads();renderChat(true);updateTitle();
  }
  if(Array.isArray(res.now)){
    for(const m of res.now.slice(0,8)){if(!validFrom(m.from)||!m.text)continue;
      const thread=m.thread==='pm'?m.from:'gc';if(thread==='gc'&&m.from==='tonyo'&&!S.tonyoIn)continue;
      const txt=String(m.text);const ms=Math.min(4200,700+txt.length*28)+Math.random()*600;
      await showTypingThen(m.from,thread,txt,ms,+m.voice||0);}
  }
  save();
}
function handleErr(e){
  const c=e&&e.code;
  if(c==='not_granted'||c==='sampling_disabled'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){sampleFn=null;setNotice('Hindi pinayagan si Claude sa page na ito, kaya hindi sila makakasagot ngayon. Pwede mo itong buksan ulit para payagan.')}
  else if(c==='rate_limited'||c==='queue_overflow'){setNotice('Ang dami nilang chika. Teka lang, subukan mo ulit mamaya.');setTimeout(()=>setNotice(''),15000)}
  else{setNotice('Nawala ang signal sa elevator. Subukan ulit mag-send.');setTimeout(()=>setNotice(''),12000)}
}

let catching=false;
async function catchUp(){
  if(!sampleFn||S.stage!=='chat'||catching)return;
  const gap=Date.now()-(S.lastCatch||0);if(gap<25*MIN)return;
  catching=true;S.lastSeenBefore=S.lastCatch;
  const gapMin=Math.round(gap/MIN);
  const gapText=gapMin<120?gapMin+' minuto':gapMin<2880?Math.round(gapMin/60)+' oras':Math.round(gapMin/1440)+' araw';
  const count=Math.max(4,Math.min(28,Math.round(4+gapMin/25)));
  setNotice('Nagkukwentuhan sila habang wala ka…');
  try{const res=await callCast(buildPrompt('catchup',null,{gapText,gapMin:Math.min(gapMin,10080),count}));S.lastCatch=Date.now();setNotice('');await applyResult(res,'catchup')}
  catch(e){handleErr(e)}
  finally{catching=false;save()}
}

// ------------------------------------------------- runtime + remote save
let dbDoc=null,dbBusy=false;
async function saveRemote(){if(!dbDoc||dbBusy)return;dbBusy=true;try{await dbDoc.set(JSON.parse(JSON.stringify(S)))}catch(e){if(e&&['revoked','invalid_argument','not_granted','quota_exceeded'].includes(e.code))dbDoc=null}finally{dbBusy=false}}
async function initRuntime(){
  const cl=window.claude;
  if(!cl||typeof cl.use!=='function'){if(S.stage==='chat')setNotice('Buksan ang claude.ai link ng page na ito para makausap sila nang totoo.');return}
  const [smp,usr,db,tts]=await Promise.all([cl.use('sample'),cl.use('user'),cl.use('db'),cl.use('tts')]);
  sampleFn=smp||null;ttsFn=tts||null;
  if(db&&usr){try{const id=await usr.id();if(id){dbDoc=db.doc('data/users/'+id+'/elevator');const snap=await dbDoc.get();
    if(snap.exists){const o=JSON.parse(JSON.stringify(snap.data()));if(o&&o.v===1&&(o.lastSeen||0)>(S.lastSeen||0)+5000){S=o;IDS.forEach(id=>{S.threads[id]=S.threads[id]||[]});boot()}}
    await saveRemote()}}catch(e){dbDoc=null}}
  if(!sampleFn&&S.stage==='chat')setNotice('Buksan ang claude.ai link ng page na ito para makausap sila nang totoo.');
  if(sampleFn)catchUp();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();saveRemote()}else if(S.stage==='chat'){deliverDue();catchUp();if(!$('app').hidden){renderChat(false);renderThreads()}}});
addEventListener('pagehide',()=>{save();saveRemote()});
addEventListener('resize',()=>{if(!$('app').hidden&&!isNarrow())$('app').classList.add('in-thread')});

function boot(){
  if(S.stage!=='chat'){showIntro();return}
  worldEvents();deliverDue();showApp();updateTitle();
  for(const m of S.threads.gc){if(m.from!=='tonyo'||m.audio)continue;
    if(m.text.startsWith('...hello? Lorna')){m.audio='vm-tonyo-hello';m.voice=17}
    else if(m.text.startsWith('Salamat po sa inyong lahat')){m.audio='vm-tonyo-bye';m.voice=10;m.text=TONYO_BYE}}
  if(!S.avatar){S.avatar=JSON.parse(JSON.stringify(DEF_ME));save();setTimeout(openLook,600)}
}
boot();
initRuntime();
</script>
